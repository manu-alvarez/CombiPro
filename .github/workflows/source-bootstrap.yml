name: CombiPro source import verification

on:
  push:
    branches: [import/combipro-canonical-20261123]
    paths:
      - .github/workflows/source-bootstrap.yml

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CombiPro branch
        uses: actions/checkout@v4
        with:
          ref: import/combipro-canonical-20261123
          path: combipro
          persist-credentials: true
      - name: Checkout pinned SERVER-DEV source
        uses: actions/checkout@v4
        with:
          repository: manu-alvarez/SERVER-DEV
          ref: 3e8a52b1006639abfba8b71836cb5c4d6b57306d
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import full application source without running deployment
        shell: bash
        run: |
          set -euo pipefail
          cp -a upstream/apps/combipro/. combipro/
          test -f combipro/src/App.tsx
          test -f combipro/package-lock.json
          test -f combipro/Dockerfile
      - name: Verify reproducible install, type checks and build
        working-directory: combipro
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Commit only validated application source to import branch
        working-directory: combipro
        shell: bash
        run: |
          set -euo pipefail
          git add -- .
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: import reproducible CombiPro application source'
          git push origin HEAD:import/combipro-canonical-20261123
