name: CombiPro one-time lockfile remediation
on:
  push:
    branches: [import/combipro-canonical-20261123]
    paths:
      - .github/workflows/repair-deps.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/combipro-canonical-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remediate and verify
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          npm ci
          npm run typecheck
          npm audit --audit-level=high
          npm run build
      - name: Commit verified lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): update audited CombiPro lockfile'
          git push origin HEAD:import/combipro-canonical-20261123
